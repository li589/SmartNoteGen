name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt
          pip install -e .

      - name: Lint with ruff
        run: ruff check src/

      - name: Test with pytest
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=87

      - name: Check P0 zero torch import
        run: |
          python -c "
          import sys
          import smartnotegen.cli
          import smartnotegen.ai.musicgen
          import smartnotegen.ai.diffrhythm
          for mod in ['torch', 'audiocraft', 'diffrhythm']:
              assert mod not in sys.modules, f'{mod} should not be imported!'
          print('P0 zero torch: OK')
          "