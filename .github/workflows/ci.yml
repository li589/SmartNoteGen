name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      # 官方 action 用 v7 及以上：v4/v5 仍跑 node20，GitHub 已对 node20 运行时报弃用告警。
      - uses: actions/checkout@v7

      - name: Pull SoundFonts from Git LFS
        run: |
          # module/ 下的 .sf2 / .exe / .dll / .ogg 由 .gitattributes 交给 Git LFS 管理。
          # checkout 默认不拉取 LFS 实体，拿到的是文本指针文件（"version https://git-lfs..."），
          # 会让 SoundFont 可加载性校验失败并把合法音色库误判为 BROKEN（ModuleError 7）。
          # 只拉必需的 .sf2，避免为 demo 音频（.ogg）浪费 LFS 带宽。
          git lfs install --local
          git lfs pull --include="module/GeneralUser_GS/**/*.sf2"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (fluidsynth + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fluidsynth ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt
          pip install -e .

      - name: Lint with ruff
        run: ruff check src/

      - name: Verify render environment
        run: |
          fluidsynth --version
          ffmpeg -version | head -n 1
          echo "--- SoundFont 实体校验（LFS 未拉取时会退化为文本指针）---"
          sf=module/GeneralUser_GS/GeneralUser-GS/GeneralUser-GS.sf2
          test -f "$sf"
          if head -c 4 "$sf" | grep -q RIFF; then
            echo "文件头 RIFF ✓ 实体已就位（大小 $(du -h "$sf" | cut -f1)）"
          else
            echo "!! $sf 不是 RIFF 开头 —— 多半是 Git LFS 指针文件，SoundFont 校验必然失败"
            head -c 40 "$sf"
            exit 1
          fi
          echo "--- SF2 加载探测（与 _probe_sf2_loadable 同命令，file 驱动免声卡）---"
          set +e
          timeout 30 fluidsynth -ni -a file "$sf" > /tmp/sf2probe.log 2>&1
          echo "exit_code=$?"
          tail -n 10 /tmp/sf2probe.log
          set -e

      - name: Test with pytest
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=87

      - name: Test suno-cat-catch-resolve subpackage
        run: |
          # 该子包是 src/ 下的独立 editable 兄弟包，主包 packages.find 已排除它，
          # 因此它的测试不在根 testpaths（tests/）内 —— 必须单独安装、单独运行，
          # 否则子包测试完全不会被 CI 收集（此前正是这种状态）。
          # 本 job 已装 ffmpeg，故其中的真实端到端用例会真正执行而非 skip。
          pip install -e src/Suno-Cat-Catch-Resolve
          cd src/Suno-Cat-Catch-Resolve
          python -m pytest --cov --cov-report=term-missing --cov-fail-under=95

      - name: Check P0 zero torch import
        run: |
          python -c "
          import sys
          import smartnotegen.cli
          import smartnotegen.ai.musicgen
          import smartnotegen.ai.diffrhythm
          for mod in ['torch', 'audiocraft', 'diffrhythm']:
              assert mod not in sys.modules, f'{mod} should not be imported!'
          print('P0 zero torch: OK')
          "