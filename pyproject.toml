[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunoauxtool"
version = "0.7.0"
description = "SunoAuxTool：Suno/海绵音乐/网易天音等 AI 音乐工具的前期+后期处理工具箱（生成/谱面/互转 + 下载/转码/DSP/视频/音质增强）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SunoAuxTool Team" }]
keywords = ["music", "midi", "suno", "music21", "fluidsynth", "video", "audiosr"]
dependencies = [
    "typer==0.27.1",
    "music21==10.5.0",
    "pretty-midi==0.2.11.post0",
    "midi2audio==0.1.1",
    "soundfile==0.14.0",
    "numpy==2.5.1",
    "tomli-w==1.2.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
mp3 = ["lameenc==1.8.4"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.11.0"]

[project.scripts]
sunoauxtool = "sunoauxtool.cli:app"
smartnotegen = "sunoauxtool.cli:app"        # 旧入口名，兼容保留
videomaker = "sunoauxtool.video.cli:app"    # 旧入口名，兼容保留
downloadhelper = "sunoauxtool.download.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
# Suno-Cat-Catch-Resolve 是 src/ 下的独立 editable 兄弟包（与 smartnotegen / videomaker 并列），
# 由 src/Suno-Cat-Catch-Resolve/pyproject.toml 单独打包。其目录名含连字符、不是合法包名，
# 主包必须排除，否则打包时会收录成非法包名。
exclude = ["versatile_audio_super_resolution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 保留全部临时目录（沙箱下回收站不可用，禁止 pytest 安全删除临时目录）
tmp_path_retention_policy = "all"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["sunoauxtool"]
# 二期起 AI 模块测试计入覆盖率（AI 适配器顶部零 torch import；推理路径由 mock 测试覆盖）。
# 因此不再 omit src/sunoauxtool/ai/*。
omit = ["src/sunoauxtool/__main__.py"]

[tool.coverage.report]
fail_under = 87

[tool.ruff]
line-length = 100
target-version = "py312"
# VASR（AudioSR 上游 fork）在 R5 入库前先排除 lint；入库时按计划清理 153 处问题
extend-exclude = ["src/versatile_audio_super_resolution"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src/smartnotegen"]
exclude = ["venv", "tests"]
# 不强制严格模式，仅作静态检查辅助
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
