[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suno-cat-catch-resolve"
version = "0.1.0"
description = "Suno 猫抓产物逆向取证与转码：识别 fMP4 明文 / 加密密文，解码为 Opus / MP3"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SmartNoteGen Team" }]
keywords = ["suno", "catcatch", "fmp4", "opus", "ffmpeg", "forensics", "smartnotegen"]
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
suno-cat-catch-resolve = "suno_cat_catch_resolve.cli:app"

# 发行名含连字符，可导入包名用下划线：目录 Suno-Cat-Catch-Resolve/suno_cat_catch_resolve/
[tool.setuptools.packages.find]
where = ["."]
include = ["suno_cat_catch_resolve*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 沙箱下回收站不可用，禁止 pytest 安全删除临时目录
tmp_path_retention_policy = "all"
filterwarnings = ["ignore::DeprecationWarning"]
